# caps.agents = true. Contributes the routing SessionStart hook to core.claude-settings.
# The sync-side agent registry is outside dotfiles-manager scope.

schema = 1
id = "agents"
platforms = ["macos"]
requires = []

[[contributions]]
resource = "core.claude-settings"
path = "/handlers"
key = "agents.session-routing"
reason = "the agents capability adds the routing-context SessionStart hook."
[contributions.value]
event = "SessionStart"
type = "command"
argv = ["${HOME}/.claude/hooks/emit-routing-context.sh"]

# The personal agent registry (DFM-25 C01). dfm clones the managed copy when missing; the
# agents updater pulls it and runs scripts/install-agent-registry.sh. A working copy at
# ~/projects/agents takes precedence for the install.
[[resources]]
id = "agent-registry"
kind = "package"
adapter = "git-checkout/v1"
[resources.value]
url = "git@github.com:stevencarpenter/agents.git"
path = ".local/share/agent-registry"
