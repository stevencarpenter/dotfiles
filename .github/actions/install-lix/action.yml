name: Install Lix
description: >-
  Install the Lix interpreter from a digest-pinned installer binary and put it
  on PATH. Both workflow jobs use the same installer pin.

runs:
  using: composite
  steps:
    # Match core.nix's Lix interpreter. This installer embeds Lix 2.95.2 and
    # enables nix-command and flakes. All declared hosts use aarch64-darwin.
    # Verify the installer digest before execution; review a new digest when updating.
    - name: Install Lix
      shell: bash
      env:
        LIX_INSTALLER_URL: https://install.lix.systems/lix/lix-installer-aarch64-darwin
        LIX_INSTALLER_SHA256: 3c71fdcfeddac8fa075b626b6e0ddd9ba73af930e47b4fa027e22c7279f596ae
      run: |
        set -euo pipefail
        curl -sSf -L -o "$RUNNER_TEMP/lix-installer" "$LIX_INSTALLER_URL"
        echo "${LIX_INSTALLER_SHA256}  $RUNNER_TEMP/lix-installer" | shasum -a 256 -c -
        chmod +x "$RUNNER_TEMP/lix-installer"
        # Non-TTY installation requires --no-confirm.
        "$RUNNER_TEMP/lix-installer" install --no-confirm
        echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"
