name: Dashboard Tabs CI

on:
  push:
    paths:
      - "firefox-dashboard-tabs/**"
      - "Justfile"
      - ".github/workflows/dashboard-tabs-ci.yml"
  pull_request:
    paths:
      - "firefox-dashboard-tabs/**"
      - "Justfile"
      - ".github/workflows/dashboard-tabs-ci.yml"

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Lint and type-check
        working-directory: firefox-dashboard-tabs
        run: |
          uv run --group dev ruff check generate.py tests
          uv run --group dev ruff format --check generate.py tests
          uv run --group dev mypy --strict generate.py

      - name: Check extension JavaScript syntax
        run: |
          node --check firefox-dashboard-tabs/extension/background.js
          node --check firefox-dashboard-tabs/tests/background.test.js

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Run generator tests
        working-directory: firefox-dashboard-tabs
        run: uv run --group dev pytest tests

      - name: Run extension behavior tests
        run: node --test firefox-dashboard-tabs/tests/background.test.js
