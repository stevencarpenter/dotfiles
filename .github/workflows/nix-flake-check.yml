name: Nix Flake Check

on:
  push:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "lib/**"
      - "hosts/**"
      - "modules/**"
      - "scripts/test-external-overlay-contract.sh"
      - "scripts/test-nix-review-regressions.sh"
      - "secrets/secrets.nix"
      - ".github/workflows/nix-flake-check.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "lib/**"
      - "hosts/**"
      - "modules/**"
      - "scripts/test-external-overlay-contract.sh"
      - "scripts/test-nix-review-regressions.sh"
      - "secrets/secrets.nix"
      - ".github/workflows/nix-flake-check.yml"

jobs:
  flake-check:
    # macOS runner: every host in lib/machines.nix is aarch64-darwin, so the
    # host closures can only be realized here.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Full history, not the default depth-1 clone: the external-overlay
          # contract test resolves this repo as `git+file://…`, and Lix refuses
          # a shallow repo there ("shallow repositories are only allowed when
          # `shallow = true;`"). Determinate Nix accepted it, so this only
          # surfaced once CI moved onto the interpreter the machines run.
          fetch-depth: 0

      # modules/darwin/core.nix sets nix.package = pkgs.lix, so CI must evaluate
      # and build under Lix too — not upstream/Determinate Nix. This step also
      # supplies the experimental-features nix.conf that every later nix call
      # needs: the installer writes `experimental-features = nix-command flakes`
      # (enable_flakes defaults true), which is why no step passes it by hand.
      #
      # Pinned by digest rather than piping install.lix.systems/lix into a
      # shell: that URL serves whatever is current, and the action this
      # replaced was SHA-pinned in 615f9b0 for the same supply-chain reason the
      # nixpkgs-unstable soak pin exists. Pinning the installer also pins the
      # interpreter — this build embeds Lix 2.95.2.
      #
      # aarch64 is hardcoded deliberately: lib/machines.nix declares only
      # aarch64-darwin hosts and the build step below targets that system.
      #
      # To bump: re-download, `shasum -a 256` it, update LIX_INSTALLER_SHA256.
      # A mismatch fails the job closed rather than installing something new.
      - name: Install Lix
        env:
          LIX_INSTALLER_URL: https://install.lix.systems/lix/lix-installer-aarch64-darwin
          LIX_INSTALLER_SHA256: 3c71fdcfeddac8fa075b626b6e0ddd9ba73af930e47b4fa027e22c7279f596ae
        run: |
          set -euo pipefail
          curl -sSf -L -o "$RUNNER_TEMP/lix-installer" "$LIX_INSTALLER_URL"
          echo "${LIX_INSTALLER_SHA256}  $RUNNER_TEMP/lix-installer" | shasum -a 256 -c -
          chmod +x "$RUNNER_TEMP/lix-installer"
          # --no-confirm is required, not cosmetic: the installer aborts when
          # stdin is not a TTY unless it is passed.
          "$RUNNER_TEMP/lix-installer" install --no-confirm
          echo "/nix/var/nix/profiles/default/bin" >> "$GITHUB_PATH"

      - name: Install contract test dependencies
        run: brew install ripgrep

      - name: Check Nix formatting
        run: git ls-files -z '*.nix' | xargs -0 nix fmt -- --check

      # The flake exports each darwin system closure through checks.<system>, so
      # this reaches every module's config.system.build.toplevel rather than
      # merely traversing the non-standard darwinConfigurations output.
      - name: Evaluate all flake checks
        run: nix flake check --no-build --all-systems

      # Realize each host closure plus the statix lint check. This catches file
      # collisions and build-time failures that evaluation alone cannot detect.
      # Targets are enumerated rather than globbed, so adding a host row to
      # lib/machines.nix also needs a line here or it goes unbuilt.
      - name: Build nix-darwin systems
        run: |
          nix build --no-link \
            '.#checks.aarch64-darwin.personal-mac' \
            '.#checks.aarch64-darwin.statix'

      # The parent/child target collision this guards occurs while realizing the
      # Home Manager files derivation, so --no-build evaluation cannot catch it.
      - name: Build external-overlay contract fixture
        run: scripts/test-external-overlay-contract.sh

      # These assertions inspect emitted activation behavior rather than merely
      # proving that the module graph evaluates.
      - name: Validate review regression contracts
        run: scripts/test-nix-review-regressions.sh
