name: Nix Flake Check

# Limit push runs to main to avoid duplicating PR runs. Keep both path lists
# in sync, including Git and tmux configs inspected by contract tests.
on:
  push:
    branches: ["main"]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "Justfile"
      - "versions/nixpkgs-unstable-candidate.json"
      - "lib/**"
      - "hosts/**"
      - "modules/**"
      - "home/.config/git/config"
      - "home/.config/tmux/tmux.conf"
      - "rebuild.sh"
      - "scripts/host-detect.sh"
      - "scripts/test-external-overlay-contract.sh"
      - "scripts/test-nix-review-regressions.sh"
      - "scripts/test-update-inputs.sh"
      - "scripts/test-update-unstable-soak.sh"
      - "scripts/update-inputs.sh"
      - "scripts/test-unstable-reminder.sh"
      - "scripts/update-unstable.sh"
      - "scripts/unstable-reminder.sh"
      - "scripts/unstable-state.sh"
      - ".github/actions/install-lix/**"
      - ".github/workflows/nix-flake-check.yml"
  # Trigger a build when a draft becomes ready without another push.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "Justfile"
      - "versions/nixpkgs-unstable-candidate.json"
      - "lib/**"
      - "hosts/**"
      - "modules/**"
      - "home/.config/git/config"
      - "home/.config/tmux/tmux.conf"
      - "rebuild.sh"
      - "scripts/host-detect.sh"
      - "scripts/test-external-overlay-contract.sh"
      - "scripts/test-nix-review-regressions.sh"
      - "scripts/test-update-inputs.sh"
      - "scripts/test-update-unstable-soak.sh"
      - "scripts/update-inputs.sh"
      - "scripts/test-unstable-reminder.sh"
      - "scripts/update-unstable.sh"
      - "scripts/unstable-reminder.sh"
      - "scripts/unstable-state.sh"
      - ".github/actions/install-lix/**"
      - ".github/workflows/nix-flake-check.yml"

# Cancel runs superseded by a newer commit on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Declare read-only permissions independently of repository settings.
permissions:
  contents: read

jobs:
  # Formatting and evaluation only. Build derivations in the cached build job.
  checks:
    name: Fast checks
    # macOS runner: every host in lib/machines.nix is aarch64-darwin, so the
    # host closures can only be realized here.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Lix's git+file input in the overlay contract test requires full history.
          fetch-depth: 0

      - name: Install Lix
        uses: ./.github/actions/install-lix

      # No store cache: measured restore cost was 256s for 17s of check work.

      - name: Check Nix formatting
        run: git ls-files -z '*.nix' | xargs -0 nix fmt -- --check

      - name: Install flake check dependencies
        run: brew install ripgrep

      # The flake exports each darwin system closure through checks.<system>, so
      # this reaches every module's config.system.build.toplevel rather than
      # merely traversing the non-standard darwinConfigurations output.
      - name: Evaluate all flake checks
        run: nix flake check --no-update-lock-file --no-build --all-systems

      - name: Validate rolling-input updater
        run: scripts/test-update-inputs.sh

      - name: Validate nixpkgs-unstable first-seen soak
        run: scripts/test-update-unstable-soak.sh

      - name: Validate unstable soak due-promotion reminder
        run: scripts/test-unstable-reminder.sh

  # Build closures once and reuse the store for contract tests. Skip draft PRs.
  build:
    name: Build system closures
    # Run concurrently with checks; setup dominates the cached build time.
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Lix
        uses: ./.github/actions/install-lix

      # Cache by flake.lock: a roughly 5-minute restore avoids a 30-minute cold build.
      - name: Restore Nix store
        uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
        with:
          primary-key: nix-build-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-build-${{ runner.os }}-
          # The action does not collect garbage on macOS unless this is a
          # number, and an unbounded store outgrows the 10GB per-repo cache.
          gc-max-store-size-macos: 6000000000

      - name: Install contract test dependencies
        run: brew install ripgrep

      # Realize each host closure plus the statix lint check. This catches file
      # collisions and build-time failures that evaluation alone cannot detect.
      # Targets are enumerated rather than globbed, so adding a host row to
      # lib/machines.nix also needs a line here or it goes unbuilt.
      - name: Build nix-darwin systems
        run: |
          nix build --no-update-lock-file --no-link \
            '.#checks.aarch64-darwin.personal-mac' \
            '.#checks.aarch64-darwin.statix'

      # Reuse the built store. Parent/child target collisions require realizing
      # Home Manager files; --no-build evaluation cannot detect them.
      - name: Build external-overlay contract fixture
        run: scripts/test-external-overlay-contract.sh

      # These assertions inspect emitted activation behavior rather than merely
      # proving that the module graph evaluates.
      - name: Validate review regression contracts
        run: scripts/test-nix-review-regressions.sh
