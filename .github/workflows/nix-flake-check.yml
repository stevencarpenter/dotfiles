name: Nix Flake Check

on:
  push:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "lib/**"
      - "hosts/**"
      - "modules/**"
      - "scripts/test-external-overlay-contract.sh"
      - "scripts/test-nix-review-regressions.sh"
      - "secrets/secrets.nix"
      - ".github/workflows/nix-flake-check.yml"
  pull_request:
    paths:
      - "flake.nix"
      - "flake.lock"
      - "lib/**"
      - "hosts/**"
      - "modules/**"
      - "scripts/test-external-overlay-contract.sh"
      - "scripts/test-nix-review-regressions.sh"
      - "secrets/secrets.nix"
      - ".github/workflows/nix-flake-check.yml"

jobs:
  flake-check:
    # macOS runner: the flake realizes both aarch64-darwin host configurations.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: Install contract test dependencies
        run: brew install ripgrep

      - name: Check Nix formatting
        run: git ls-files -z '*.nix' | xargs -0 nix fmt -- --check

      # The flake exports each darwin system closure through checks.<system>, so
      # this reaches every module's config.system.build.toplevel rather than
      # merely traversing the non-standard darwinConfigurations output.
      - name: Evaluate all flake checks
        run: nix flake check --no-build --all-systems

      # Realize both closures. This catches file collisions and build-time
      # failures that evaluation alone cannot detect.
      - name: Build nix-darwin systems
        run: |
          nix build --no-link \
            '.#checks.aarch64-darwin.personal-mac' \
            '.#checks.aarch64-darwin.statix'

      # The parent/child target collision this guards occurs while realizing the
      # Home Manager files derivation, so --no-build evaluation cannot catch it.
      - name: Build external-overlay contract fixture
        run: scripts/test-external-overlay-contract.sh

      # These assertions inspect emitted activation behavior rather than merely
      # proving that the module graph evaluates.
      - name: Validate review regression contracts
        run: scripts/test-nix-review-regressions.sh
