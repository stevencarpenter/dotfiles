name: MCP Sync CI

on:
  push:
    paths:
      - "mcp_sync/**"
      - ".claude/skills/mcp-sync-verify/scripts/print_target_paths.py"
      - "home/.config/skills/**"
      - "home/.config/mcp/**"
      - "skills/**"
      - "lib/machines.nix"
      - "modules/home/sync-hooks.nix"
      - ".github/workflows/mcp-sync-ci.yml"
  pull_request:
    paths:
      - "mcp_sync/**"
      - ".claude/skills/mcp-sync-verify/scripts/print_target_paths.py"
      - "home/.config/skills/**"
      - "home/.config/mcp/**"
      - "skills/**"
      - "lib/machines.nix"
      - "modules/home/sync-hooks.nix"
      - ".github/workflows/mcp-sync-ci.yml"

# Least privilege, declared in-tree rather than inherited from the repo default.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"

      - name: Lint with ruff
        working-directory: mcp_sync
        run: |
          uv run --group dev ruff check src tests
          uv run --group dev ruff format --check src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"

      - name: Run tests
        working-directory: mcp_sync
        run: |
          uv run --group dev pytest --cov=mcp_sync --cov-report=term-missing
          uv run --group dev sync-skills --help
