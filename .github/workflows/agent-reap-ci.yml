name: Agent Reap CI

on:
  push:
    paths:
      - "agent_reap/**"
      - "home/.config/agent-reap/**"
      - ".github/workflows/agent-reap-ci.yml"
  pull_request:
    paths:
      - "agent_reap/**"
      - "home/.config/agent-reap/**"
      - ".github/workflows/agent-reap-ci.yml"

# Least privilege, declared in-tree rather than inherited from the repo default.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.14"

      - name: Lint with ruff
        working-directory: agent_reap
        run: |
          uv run --group dev ruff check src tests
          uv run --group dev ruff format --check src tests

      - name: Type-check with mypy
        working-directory: agent_reap
        run: uv run --group dev mypy src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          python-version: "3.14"

      - name: Run tests
        working-directory: agent_reap
        run: |
          uv run --group dev pytest --cov=agent_reap --cov-report=term-missing
          uv run --group dev agent-reap --help
