name: Agent Reap CI

on:
  push:
    paths:
      - "agent_reap/**"
      - "home/.config/agent-reap/**"
      - ".github/workflows/agent-reap-ci.yml"
  pull_request:
    paths:
      - "agent_reap/**"
      - "home/.config/agent-reap/**"
      - ".github/workflows/agent-reap-ci.yml"

# Least privilege, declared in-tree rather than inherited from the repo default.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"

      - name: Lint with ruff
        working-directory: agent_reap
        run: |
          uv run --group dev ruff check src tests
          uv run --group dev ruff format --check src tests

      - name: Type-check with mypy
        working-directory: agent_reap
        run: uv run --group dev mypy src tests

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"

      - name: Run tests
        working-directory: agent_reap
        run: |
          uv run --group dev pytest --cov=agent_reap --cov-report=term-missing
          uv run --group dev agent-reap --help
