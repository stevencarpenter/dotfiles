name: Dotfiles Hygiene CI

on:
  push:
    paths:
      - ".github/workflows/dotfiles-hygiene-ci.yml"
      - ".pre-commit-config.yaml"
      - "home/**"
      - "modules/**"
      - "lib/**"
      - "scripts/**"
      - "bootstrap.sh"
      - "rebuild.sh"
      - "README.md"
  pull_request:
    paths:
      - ".github/workflows/dotfiles-hygiene-ci.yml"
      - ".pre-commit-config.yaml"
      - "home/**"
      - "modules/**"
      - "lib/**"
      - "scripts/**"
      - "bootstrap.sh"
      - "rebuild.sh"
      - "README.md"

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install shell test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends zsh

      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files

      - name: Validate MCP master config structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("home/.config/mcp/mcp-master.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          if not isinstance(data, dict):
              raise SystemExit("mcp-master.json must be a JSON object")

          # Master may define zero shared servers; the per-machine servers
          # live in machine overlays (home/.config/mcp/machine/*.json).
          servers = data.get("servers")
          if not isinstance(servers, dict):
              raise SystemExit("mcp-master.json must define a 'servers' object")

          for server_name, server_config in servers.items():
              if not isinstance(server_config, dict):
                  raise SystemExit(f"Server '{server_name}' must be a JSON object")
              if server_config.get("type") == "stdio" and not server_config.get("command"):
                  raise SystemExit(f"Server '{server_name}' uses stdio but has no 'command'")
          PY

      - name: Shell syntax checks
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "${file}"
          done < <(find scripts -type f -name "*.sh" -print0)
          bash -n bootstrap.sh
          bash -n rebuild.sh

      - name: Validate SketchyBar clock popup behavior
        run: scripts/test-sketchybar-clock-popup.sh

      - name: Validate SketchyBar badge wiring
        run: scripts/test-sketchybar-badge-wiring.sh

      - name: Validate Claude settings merge order
        run: scripts/test-claude-settings-order.sh

      - name: Validate Claude statusline rendering
        run: scripts/test-claude-statusline-command.sh

      - name: Validate op-render fail-safe renderer
        run: scripts/test-op-render.sh
