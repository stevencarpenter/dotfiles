name: Dotfiles Hygiene CI

on:
  push:
    paths:
      - ".github/workflows/dotfiles-hygiene-ci.yml"
      - "lefthook.yml"
      - "home/**"
      - "modules/**"
      - "lib/**"
      - "scripts/**"
      - "docs/**"
      - "agent_reap/README.md"
      - "CLAUDE.md"
      - "Justfile"
      - "bootstrap.sh"
      - "rebuild.sh"
      - "README.md"
      - "ruff.toml"
      - ".gitleaks.toml"
      - ".claude/**"
      - "skills/**"
  pull_request:
    paths:
      - ".github/workflows/dotfiles-hygiene-ci.yml"
      - "lefthook.yml"
      - "home/**"
      - "modules/**"
      - "lib/**"
      - "scripts/**"
      - "docs/**"
      - "agent_reap/README.md"
      - "CLAUDE.md"
      - "Justfile"
      - "bootstrap.sh"
      - "rebuild.sh"
      - "README.md"
      - "ruff.toml"
      - ".gitleaks.toml"
      - ".claude/**"
      - "skills/**"

# Least privilege, declared in-tree rather than inherited from the repo default.
permissions:
  contents: read

jobs:
  hygiene:
    # Exercise macOS bootstrap and BSD stat, mktemp, and sed behavior.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      # Standalone Python in this repo is a PEP 723 uv script
      # (`#!/usr/bin/env -S uv run --script`), so tests that exec one by
      # path need uv on the runner. Exception: home/.claude/hooks/lib/*.py
      # uses #!/usr/bin/python3 (macOS 3.9, no uv at hook time).
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"

      # Match homebrew.nix's Bash; SketchyBar associative arrays need Bash >= 4.
      - name: Install shell test dependencies
        run: brew install ripgrep bash tmux just jq

      # lefthook runs the git hooks defined in lefthook.yml; gitleaks backs the
      # secret-scan job and is invoked directly below for the whole-tree scan.
      - name: Install git hook tooling
        run: brew install lefthook gitleaks

      - name: Run lefthook pre-commit jobs
        run: lefthook run pre-commit --all-files --force --no-auto-install --no-stage-fixed

      # The lefthook job scans STAGED changes only, which is empty on a CI
      # checkout. Scan the whole tree here so a leak in an unstaged or
      # already-committed file still fails the build.
      - name: Scan the whole tree for secrets
        run: gitleaks dir . --redact --no-banner

      - name: Validate lefthook job coverage
        run: scripts/test-lefthook-hooks.sh

      - name: Validate MCP master config structure
        run: scripts/validate-mcp-master.py

      - name: Validate Firstmate launcher
        run: scripts/test-firstmate-config.sh

      - name: Shell syntax checks
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "${file}"
          done < <(find scripts -type f -name "*.sh" -print0)
          bash -n bootstrap.sh
          bash -n rebuild.sh

      - name: Validate agent tools allowlist gate
        run: scripts/test-agent-tools-allowlist.sh

      - name: Validate exec bits on directly-exec'd scripts
        run: scripts/test-exec-bits.sh

      - name: Validate fantasy-sports agent and skill install
        run: scripts/test-install-fantasy-sports.sh

      - name: Validate tmux lifecycle contract
        run: scripts/test-tmux-lifecycle-contract.sh

      - name: Test SubagentStop payload parser
        run: scripts/test_subagent_stop_payload.py

      - name: Test blind-review context stripper
        run: scripts/test_strip_context.py

      - name: Lint loose Python (scripts, hook libs, skill scripts)
        run: uvx ruff check .

      - name: Validate ssh ControlPath identity separation
        run: scripts/test-ssh-controlpath-identity.sh

      - name: Validate gh account routing wrapper
        run: scripts/test-gh-account-routing.sh

      - name: Validate gcampr PR creation flow
        run: zsh -f scripts/test-gcampr.zsh

      - name: Validate Obsidian capture routing and retries
        run: scripts/test-obsidian-capture.sh

      - name: Validate Worktrunk commit generation
        run: scripts/test-worktrunk-commit-generator.sh

      - name: Validate SketchyBar clock popup behavior
        run: scripts/test-sketchybar-clock-popup.sh

      - name: Validate SketchyBar badge wiring
        run: scripts/test-sketchybar-badge-wiring.sh

      - name: Validate Claude settings merge order
        run: scripts/test-claude-settings-order.sh

      - name: Validate Claude statusline rendering
        run: scripts/test-claude-statusline-command.sh

      - name: Validate op-render fail-safe renderer
        run: scripts/test-op-render.sh

      - name: Validate guarded 1Password reverse adoption
        run: scripts/test_op_adopt.py

      - name: Validate direct activation entry points
        run: scripts/test-sync-hook-runtime.sh

      - name: Validate Home Manager parent symlink guard
        run: scripts/test-home-link-parents.sh

      - name: Validate Claude settings hook preservation
        run: scripts/test-claude-hooks-preservation.sh

      - name: Validate fresh-bootstrap CLT gate
        run: scripts/test-bootstrap-clt-gate.sh

      - name: Validate sync capability boundary
        run: scripts/test-sync-capability-gating.sh

      - name: Validate Python recipe failure propagation
        run: scripts/test-python-check-failures.sh

      - name: Validate repository atlas contracts
        run: scripts/test-build-site.sh

      - name: Validate rolling-input updater
        run: scripts/test-update-inputs.sh

      - name: Validate Homebrew audit is read-only
        run: scripts/test-homebrew-audit-read-only.sh

      - name: Validate Railway psql failure propagation
        run: scripts/test-railway-psql-errors.sh

      - name: Validate Railway analysis helpers
        run: uv run --script scripts/test_railway_analysis.py

      - name: Validate skill helper command behavior
        run: bash scripts/test-skill-helper-cli.sh

      - name: Validate atuin config variant parity (includes mutation audit)
        run: scripts/check-atuin-parity.py

      # Require zsh so shell checks cannot silently skip.
      - name: Ensure zsh is available
        run: command -v zsh >/dev/null 2>&1 || brew install zsh

      - name: Validate zsh eval-cache behavior
        run: scripts/test-eval-cache.sh
