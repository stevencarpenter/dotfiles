name: Dotfiles Hygiene CI

on:
  push:
    paths:
      - ".github/workflows/dotfiles-hygiene-ci.yml"
      - ".pre-commit-config.yaml"
      - "home/**"
      - "modules/**"
      - "lib/**"
      - "scripts/**"
      - "docs/**"
      - "agent_reap/README.md"
      - "CLAUDE.md"
      - "bootstrap.sh"
      - "rebuild.sh"
      - "README.md"
  pull_request:
    paths:
      - ".github/workflows/dotfiles-hygiene-ci.yml"
      - ".pre-commit-config.yaml"
      - "home/**"
      - "modules/**"
      - "lib/**"
      - "scripts/**"
      - "docs/**"
      - "agent_reap/README.md"
      - "CLAUDE.md"
      - "bootstrap.sh"
      - "rebuild.sh"
      - "README.md"

# Least privilege, declared in-tree rather than inherited from the repo default.
permissions:
  contents: read

jobs:
  hygiene:
    # macOS runner: these scripts exercise real macOS dotfiles config (stat,
    # mktemp, sed, and other BSD-vs-GNU-divergent behavior) and one guards a
    # macOS-only bootstrap path. ubuntu-latest previously ran the same scripts
    # against GNU userland, which is a different program on the coreutils/BSD
    # divergences and requires portability shims that add no coverage here.
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      # bash: modules/darwin/homebrew.nix installs this on every real machine,
      # replacing Apple's frozen /usr/bin/bash 3.2 (GPLv2 license freeze) with
      # a modern one on the front of PATH. Scripts like sketchybar's
      # aerospace.sh plugin rely on that machine invariant (associative
      # arrays need bash >= 4) via a bare `bash` invocation rather than a
      # pinned path — a fresh runner without this formula fails that check.
      - name: Install shell test dependencies
        run: brew install ripgrep bash tmux

      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit

      - name: Run pre-commit checks
        run: pre-commit run --all-files

      - name: Validate MCP master config structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("home/.config/mcp/mcp-master.json")
          data = json.loads(path.read_text(encoding="utf-8"))

          if not isinstance(data, dict):
              raise SystemExit("mcp-master.json must be a JSON object")

          # Master may define zero shared servers; the per-machine servers
          # live in machine overlays (home/.config/mcp/machine/*.json).
          servers = data.get("servers")
          if not isinstance(servers, dict):
              raise SystemExit("mcp-master.json must define a 'servers' object")

          for server_name, server_config in servers.items():
              if not isinstance(server_config, dict):
                  raise SystemExit(f"Server '{server_name}' must be a JSON object")
              if server_config.get("type") == "stdio" and not server_config.get("command"):
                  raise SystemExit(f"Server '{server_name}' uses stdio but has no 'command'")
          PY

      - name: Shell syntax checks
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            bash -n "${file}"
          done < <(find scripts -type f -name "*.sh" -print0)
          bash -n bootstrap.sh
          bash -n rebuild.sh

      - name: Validate exec bits on directly-exec'd scripts
        run: scripts/test-exec-bits.sh

      - name: Validate tmux lifecycle contract
        run: scripts/test-tmux-lifecycle-contract.sh

      - name: Validate ssh ControlPath identity separation
        run: scripts/test-ssh-controlpath-identity.sh

      - name: Validate gh account routing wrapper
        run: scripts/test-gh-account-routing.sh

      - name: Validate Obsidian capture routing and retries
        run: scripts/test-obsidian-capture.sh

      - name: Validate Worktrunk commit generation
        run: scripts/test-worktrunk-commit-generator.sh

      - name: Validate SketchyBar clock popup behavior
        run: scripts/test-sketchybar-clock-popup.sh

      - name: Validate SketchyBar badge wiring
        run: scripts/test-sketchybar-badge-wiring.sh

      - name: Validate Claude settings merge order
        run: scripts/test-claude-settings-order.sh

      - name: Validate Claude statusline rendering
        run: scripts/test-claude-statusline-command.sh

      - name: Validate op-render fail-safe renderer
        run: scripts/test-op-render.sh

      - name: Validate guarded 1Password reverse adoption
        run: python scripts/test_op_adopt.py

      - name: Validate direct activation entry points
        run: scripts/test-sync-hook-runtime.sh

      - name: Validate Claude settings hook preservation
        run: scripts/test-claude-hooks-preservation.sh

      - name: Validate fresh-bootstrap CLT gate
        run: scripts/test-bootstrap-clt-gate.sh

      - name: Validate sync capability boundary
        run: scripts/test-sync-capability-gating.sh

      - name: Validate rolling-input updater
        run: scripts/test-update-inputs.sh

      - name: Validate Homebrew audit is read-only
        run: scripts/test-homebrew-audit-read-only.sh

      - name: Validate Railway psql failure propagation
        run: scripts/test-railway-psql-errors.sh

      - name: Validate atuin config variant parity
        run: scripts/test-atuin-filter-parity.sh

      # Mutation audit: proves the parity guard above actually FAILS on each
      # regression it claims to catch. Its first version passed while the
      # original defect was reproducible, so "the guard is green" is not by
      # itself evidence of anything.
      - name: Validate the atuin parity guard actually fails on regressions
        run: scripts/test-atuin-filter-parity-mutations.sh

      # zsh ships by default on macOS runners, but this stays a real install
      # rather than an assumption: a silently skipped test is indistinguishable
      # from a passing one if that ever stops being true.
      - name: Ensure zsh is available
        run: command -v zsh >/dev/null 2>&1 || brew install zsh

      - name: Validate zsh eval-cache behavior
        run: scripts/test-eval-cache.sh
