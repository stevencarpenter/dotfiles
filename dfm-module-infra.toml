# infra capability: Kubernetes and cluster-ops tooling through mise (conf.d/infra.toml).

schema = 1
id = "infra"
platforms = ["macos"]
requires = []

[[resources]]
id = "config-mise-conf-d-infra-toml"
kind = "link"
adapter = "fs-link/v1"
target = ".config/mise/conf.d/infra.toml"
[resources.value]
source = "home/.config/mise/conf.d/infra.toml"
