# identity == personal, plus the 'identity != work' tailscale shell file. The per-identity files
# of shared capabilities also live here, so an external bundle's identity module can supply
# its own (docs/external-bundles.md).

schema = 1
id = "personal"
platforms = ["macos"]
requires = []

[[resources]]
id = "config-zsh-profile-d-personal-shell-functions-zsh"
kind = "link"
adapter = "fs-link/v1"
target = ".config/zsh/profile.d/personal-shell-functions.zsh"
[resources.value]
source = "home/.config/zsh/profile.d/personal-shell-functions.zsh"

[[resources]]
id = "config-zsh-profile-d-personal-secrets-zsh"
kind = "link"
adapter = "fs-link/v1"
target = ".config/zsh/profile.d/personal-secrets.zsh"
[resources.value]
source = "home/.config/zsh/profile.d/personal-secrets.zsh"

[[resources]]
id = "config-op-render-manifest"
kind = "link"
adapter = "fs-link/v1"
target = ".config/op/render-manifest"
[resources.value]
source = "home/.config/op/render-manifest"

[[resources]]
id = "config-op-adopt-policy-json"
kind = "link"
adapter = "fs-link/v1"
target = ".config/op/adopt-policy.json"
[resources.value]
source = "home/.config/op/adopt-policy.json"

[[resources]]
id = "local-bin-op-adopt"
kind = "link"
adapter = "fs-link/v1"
target = ".local/bin/op-adopt"
[resources.value]
source = "home/.local/bin/op-adopt"

[[resources]]
id = "config-hippo"
kind = "link"
adapter = "fs-link/v1"
target = ".config/hippo"
[resources.value]
source = "home/.config/hippo"
directory = true

[[resources]]
id = "config-zsh-profile-d-tailscale-zsh"
kind = "link"
adapter = "fs-link/v1"
target = ".config/zsh/profile.d/tailscale.zsh"
[resources.value]
source = "home/.config/zsh/profile.d/tailscale.zsh"

[[resources]]
id = "config-zsh-personal-env"
kind = "secret"
adapter = "op-template/v1"
target = ".config/zsh/.personal.env"
[resources.value]
template = "home/.config/zsh/.personal.env.tpl"
account = "my.1password.com"
mode = 0o600

# Claude sandbox write paths for this user; core.claude-settings appends every fragment in
# .claude/settings.d to sandbox.filesystem.allowWrite.
[[resources]]
id = "claude-settings-d-10-personal-json"
kind = "link"
adapter = "fs-link/v1"
target = ".claude/settings.d/10-personal.json"
[resources.value]
source = "home/.claude/settings.d/10-personal.json"

