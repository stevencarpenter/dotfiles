# caps.skills: the skills manifest. The machine/<identity>.json overlay and the pinned skill
# links differ per identity, so the identity module links them.

schema = 1
id = "skills"
platforms = ["macos"]
requires = []

[[resources]]
id = "config-skills-skills-master-json"
kind = "link"
adapter = "fs-link/v1"
target = ".config/skills/skills-master.json"
[resources.value]
source = "home/.config/skills/skills-master.json"
