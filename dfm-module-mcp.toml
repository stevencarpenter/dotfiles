# caps.mcp: master config, pi files and the mise axi tools. The machine/<identity>.json
# overlay differs per identity, so the identity module links it.
# Not managed: .config/mcp/overrides (an identity module may link a file there), MCP generated
# outputs, and .pi/agent/models.json (scripts/sync-side-channels.sh writes it from the shared,
# provider-free home/.pi/agent/models.json plus the identity's models.<identity>.json, if linked).

schema = 1
id = "mcp"
platforms = ["macos"]
requires = []

[[resources]]
id = "config-mcp-mcp-master-json"
kind = "link"
adapter = "fs-link/v1"
target = ".config/mcp/mcp-master.json"
[resources.value]
source = "home/.config/mcp/mcp-master.json"

[[resources]]
id = "copilot-settings-json"
kind = "link"
adapter = "fs-link/v1"
target = ".copilot/settings.json"
[resources.value]
source = "home/.copilot/settings.json"

[[resources]]
id = "cursor-cli-config-json"
kind = "link"
adapter = "fs-link/v1"
target = ".cursor/cli-config.json"
[resources.value]
source = "home/.cursor/cli-config.json"

[[resources]]
id = "pi-agent-settings-json"
kind = "link"
adapter = "fs-link/v1"
target = ".pi/agent/settings.json"
[resources.value]
source = "home/.pi/agent/settings.json"

[[resources]]
id = "pi-agent-themes-everforest-dark-hard-json"
kind = "link"
