[resources.value]
source = "home/.pi/agent/themes/everforest-dark-hard.json"

[[resources]]
id = "pi-agent-prompts-review-md"
kind = "link"
adapter = "fs-link/v1"
target = ".pi/agent/prompts/review.md"
[resources.value]
source = "home/.pi/agent/prompts/review.md"

[[resources]]
id = "pi-agent-prompts-blind-review-md"
kind = "link"
