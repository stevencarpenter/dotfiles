# caps.mcp: master config, pi and firstmate files. The machine/<identity>.json overlay differs
# per identity, so the identity module links it.
# Not managed: .config/mcp/overrides (.keep seam), MCP generated outputs.

schema = 1
id = "mcp"
platforms = ["macos"]
requires = []

[[resources]]
id = "config-mcp-mcp-master-json"
kind = "link"
adapter = "fs-link/v1"
target = ".config/mcp/mcp-master.json"
[resources.value]
source = "home/.config/mcp/mcp-master.json"

[[resources]]
id = "copilot-settings-json"
kind = "link"
adapter = "fs-link/v1"
target = ".copilot/settings.json"
