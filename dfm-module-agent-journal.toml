# agent_journal capability: CLI wrappers on every enabled host. The config files differ per
# identity, so the identity module links them.

schema = 1
id = "agent-journal"
platforms = ["macos"]
requires = []

[[resources]]
id = "local-bin-agent-journal"
kind = "link"
adapter = "fs-link/v1"
target = ".local/bin/agent-journal"
[resources.value]
source = "home/.local/bin/agent-journal"

[[resources]]
id = "local-bin-agent-note"
kind = "link"
adapter = "fs-link/v1"
target = ".local/bin/agent-note"
[resources.value]
source = "home/.local/bin/agent-note"
