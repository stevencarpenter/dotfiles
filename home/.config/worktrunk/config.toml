# # User Configuration
#
# Create with `wt config create`.
#
# Location:
#
# - macOS/Linux: `~/.config/worktrunk/config.toml` (or `$XDG_CONFIG_HOME` if set)
# - Windows: `%APPDATA%\worktrunk\config.toml`
#
# ## Worktree path template
#
# Controls where new worktrees are created.
#
# **Variables:**
#
# - `{{ repo_path }}` — absolute path to the repository (e.g., `/Users/me/code/myproject`)
# - `{{ repo }}` — repository directory name (e.g., `myproject`)
# - `{{ branch }}` — raw branch name (e.g., `feature/auth`)
# - `{{ branch | sanitize }}` — filesystem-safe: `/` and `\` become `-` (e.g., `feature-auth`)
# - `{{ branch | sanitize_db }}` — database-safe: lowercase, underscores, hash suffix (e.g., `feature_auth_x7k`)
#
# **Examples**
# for repo at `~/code/myproject`, branch `feature/auth`:
#
# # Default — sibling directory
# # Creates: ~/code/myproject-feature-auth
worktree-path = "{{ repo_path }}/../{{ repo }}-{{ branch | sanitize }}"

[[pre-start]]
copy = "wt step copy-ignored"

# ## Command config
#
# ### List
#
# Persistent flag values for `wt list`. Override on command line as needed.
#
[list]
summary = true    # Enable LLM branch summaries (requires [commit.generation])

full = true       # Show CI, main…± diffstat, and LLM summaries (--full)
branches = true   # Include branches without worktrees (--branches)
# Pins the `wt list --json` output schema. Pre-existing deprecation surfaced by
# `wt config show`; applied by hand rather than via `wt config update` because
# ~/.config/worktrunk is a read-only nix-store directory symlink and a rewrite
# through it can fail on the atomic rename.
json-schema = 2
# remotes = false    # Include remote-only branches (--remotes)
#
# ### Commit
#
# Shared by `wt step commit`, `wt step squash`, and `wt merge`.
#
[commit]
stage = "all"      # What to stage before commit: "all", "tracked", or "none"

[commit.generation]
# The local wrapper retains Worktrunk's documented safe Claude invocation and
# rejects invalid output before Worktrunk can pass it to Git. What the flags buy:
#   --safe-mode              hermetic: no hooks, plugins, MCP, skills, or CLAUDE.md.
#                            Without it this call ingests whatever CLAUDE.md sits above
#                            the repo — instructions written for PR bodies ("include
#                            purpose, key changed paths, test evidence") reaching a
#                            haiku model with no system prompt and no thinking budget,
#                            which is a plausible source of the PR-prose-as-subject
#                            messages seen in Aug 2026. Requires Claude Code >= 2.1.169.
#   --no-session-persistence keeps generated-commit turns out of `claude --continue`.
#   --setting-sources=user   the documented value; empty can break setups that
#                            authenticate through apiKeyHelper rather than OAuth.
# `CLAUDECODE=` (empty, not inherited) is kept deliberately: it clears the harness's
# nested-invocation guard so this works when `wt` is driven from inside a session.
# `--disable-slash-commands` is also kept — a diff line beginning with `/` must not be
# read as a command, and --safe-mode does not cover that.
command = "\"$HOME/.local/bin/worktrunk-commit-generator\""

# The wrapper validates locally, retries once with exact validation feedback,
# then fails closed without printing rejected output. `--validate` exposes the
# same deterministic check for tests and manual diagnosis. Bodies remain valid,
# but must start after a blank line; prose before the Conventional subject is
# rejected rather than silently rearranged.

# Style guidance is APPENDED to worktrunk's own prompts rather than replacing them.
# This block previously carried a full inline copy of the default squash-template,
# which had two costs. It had already drifted from upstream (`{% for commit in
# commit_details %}{{ commit }}` where the current default is `{% for detail in
# commit_details %}{{ detail.subject }}`), and — the real problem — a custom template
# that does not reference `{{ user_guidance }}` / `{{ project_guidance }}` silently
# OPTS OUT of template-append entirely, so no style guide could ever reach the model.
# Deleting the fork restores the upstream default (which interpolates both blocks) and
# leaves only the delta here, per docs/external-overlays.md's ordering: native layering
# over whole-file swap, because forked copies stop receiving base improvements.
#
# The rules below are the ones actually violated by generated messages in Aug 2026:
# a body-style sentence promoted to the subject with the real `chore:` subject demoted
# into the body, and unbalanced trailing `)` on two others. `template-append` is marked
# experimental upstream; if it is ever dropped, these move into a full template override.
template-append = """
- Subject MUST use a lowercase Conventional Commit prefix: build:, chore:, ci:, docs:,
  feat:, fix:, perf:, refactor:, revert:, style:, test:
- The subject is the change in imperative mood, never an explanatory sentence about it.
  Any explanation belongs in the body, after a blank line — never on the subject line.
- No trailing period on the subject
- Every parenthesis, bracket, brace, double quote and backtick must be balanced;
  emit no stray `)`
- Never claim that an AI/assistant/agent/model/harness generated or authored the
  message, and never add a Co-Authored-By trailer
"""

# #### Squash template
#
# Intentionally NOT overridden — see the template-append note above. `wt config create
# --help` prints the current defaults for both the commit and squash templates if a
# full override is ever genuinely needed; copying one back in here re-forks it and
# re-disables template-append.

# ### Merge
#
# All flags are on by default. Set to false to change default behavior.
#
[merge]
squash = true      # Squash commits into one (--no-squash to preserve history)
commit = true      # Commit uncommitted changes first (--no-commit to skip)
# rebase = true      # Rebase onto target before merge (--no-rebase to skip)
# remove = true      # Remove worktree after merge (--no-remove to keep)
# verify = true      # Run project hooks (--no-verify to skip)
#
# ### Switch picker
#
# Configuration for `wt switch` interactive picker.
#
[switch.picker]
# Pager command for diff preview (overrides git's core.pager)
pager = "delta --paging=never"
