# Atuin client config — SYNCING variant. Selected by modules/home/dotfiles.nix
# when caps.atuin is true; the non-syncing twin is config.local.toml.
#
# The history_filter blocks in the two files MUST stay byte-identical —
# enforced by scripts/test-atuin-filter-parity.sh in dotfiles-hygiene-ci.
# Everything OUTSIDE that block is free to differ; the sync stanza is the
# whole point of the split.
#
# Self-hosted sync target. Server lives on i9 (homelab repo: services/atuin/,
# fronted by Caddy at logbook.snugmarina.org).
#
# Verify the server is healthy from any tailnet device:
#   curl -fsSL https://logbook.snugmarina.org   # → "goodbye and good luck"
#
# Bootstrap on a fresh machine (server registration must be open — see
# homelab repo services/atuin/README.md "Bootstrap: register accounts"):
#   atuin register -u <username> -e <email> -p <password>   # first machine
#   atuin login    -u <username>                            # subsequent machines
#   atuin import auto
#   atuin sync
sync_address = "https://logbook.snugmarina.org"

# --- BEGIN history_filter (parity-checked against the twin variant) ---
history_filter = [
    "DIUN_TOKEN",
    "NTFY_PASSWORD",
    "NTFY_ADMIN_PASS",
    "DIUN_USER_PASS",
    "tk_[A-Za-z0-9_]+",
    "op item (create|edit).*password",
    "sk-proj-[A-Za-z0-9_-]+",
    "ghp_[A-Za-z0-9]+",
    "xox[bap]-[A-Za-z0-9-]+",
    "AKIA[0-9A-Z]{16}",
]
# --- END history_filter ---

# Render the interactive search UI in a tmux popup rather than inline in the
# current pane. This drives BOTH ctrl-r and the up-arrow binding: `atuin init
# zsh` reads this key at init time and emits `export ATUIN_TMUX_POPUP=false`
# when it is absent or false, after which __atuin_tmux_popup_check fails and
# __atuin_search_cmd falls back to rendering inline. Requires tmux >= 3.2;
# outside tmux it renders inline regardless. The ATUIN_TMUX_POPUP env var can
# override at runtime.
[tmux]
enabled = true
