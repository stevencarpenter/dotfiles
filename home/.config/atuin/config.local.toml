# Local history variant, selected when caps.atuin is false.
# Keep history_filter identical to config.sync.toml; CI checks parity.
# Set auto_sync explicitly: Atuin defaults to syncing with its public server,
# even when sync_address is absent.
auto_sync = false

# --- BEGIN history_filter (parity-checked against the twin variant) ---
history_filter = [
    "DIUN_TOKEN",
    "NTFY_PASSWORD",
    "NTFY_ADMIN_PASS",
    "DIUN_USER_PASS",
    "tk_[A-Za-z0-9_]+",
    "op item (create|edit).*password",
    "sk-proj-[A-Za-z0-9_-]+",
    "ghp_[A-Za-z0-9]+",
    "xox[bap]-[A-Za-z0-9-]+",
    "AKIA[0-9A-Z]{16}",
]
# --- END history_filter ---

# Ctrl-r and up-arrow use a popup under tmux >= 3.2, otherwise inline search.
# Init output embeds this setting; ATUIN_TMUX_POPUP can override it at runtime.
[tmux]
enabled = true
