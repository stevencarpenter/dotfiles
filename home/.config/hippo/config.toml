[inference]
base_url = "http://127.0.0.1:42069/v1" # oMLX local server (LM Studio: :1234)
timeout_secs = 300                     # HTTP timeout for chat/embed calls

[models]
# ── Chat / enrichment models ──────────────────────────────────────────
# 6-bit: about 10 GB less memory and about 25% less weight traffic per token than
# 8-bit. No Heretic 6-bit upload exists; convert locally from the Heretic bf16 with
# `mlx_lm.convert -q --q-bits 6` into oMLX's model dir under exactly this name, or
# enrichment fails. Rollback: the 8-bit ID below. Compare: `just hippo-eval`.
enrichment = "Qwen3.6-35B-A3B-Uncensored-Heretic-MLX-6bit"      # Qwen 3.6 MoE, 35B total / 3B active, 6-bit MLX
enrichment_bulk = "Qwen3.6-35B-A3B-Uncensored-Heretic-MLX-6bit" # Same local model for bulk enrichment
query = "Qwen3.6-35B-A3B-Uncensored-Heretic-MLX-6bit"          # Same local model for query reformulation
# enrichment = "Qwen3.6-35B-A3B-Uncensored-Heretic-MLX-8bit"    # previous: 8-bit MLX, ~95 tok/s on M5 Max
# ── Embedding model ───────────────────────────────────────────────────
embedding = "nomicai-modernbert-embed-base-8bit" # 768d MLX embedding (ModernBERT, nomic lineage)

[daemon]
flush_interval_ms = 100 # Write buffer flush interval (ms)
flush_batch_size = 50   # Max events per flush
socket_timeout_ms = 100 # CLI-to-daemon socket timeout (ms)

[brain]
port = 9175
poll_interval_secs = 5     # Enrichment queue poll interval
enrichment_batch_size = 10 # Events per enrichment batch (session-based live enrichment)
max_events_per_chunk = 10  # Max events per enrichment chunk
max_queue_depth = 500      # Max pending enrichment items
query_timeout_secs = 300   # GUI timeout for /ask and /query requests (seconds)

typesafe_api_key_op_ref = "op://Private/4uzrillvqfdgkv5stwzekoqwfa/credential"
[github]
enabled = true
watched_repos = [
  "stevencarpenter/hippo",
  "stevencarpenter/nuv",
