# Firstmate's required toolchain. Upstream sets its axi floors to the current
# latest release and raises them several times a week, so exact pins go stale
# within days; `mise upgrade` in sync keeps these current.
# Pi, node, git, gh, jq, and tmux are declared elsewhere.
[tools]
"github:kunchenguid/treehouse" = "latest"
"github:kunchenguid/no-mistakes" = "latest"
"npm:gh-axi" = "latest"
"npm:chrome-devtools-axi" = "latest"
"npm:tasks-axi" = "latest"
"npm:quota-axi" = "latest"
