# agent-reap: idle Claude teammate reaper.
#
# Plain out-of-store symlink (modules/home/dotfiles.nix): edits here are live,
# no rebuild needed.
#
# Nothing in this file can cause a kill on its own. `agent-reap` is report-only
# until you pass --kill, and interactive sessions are never killed by the reap
# subcommand at all.

# Search standard and z4h sockets. {uid} is expanded at load; symlink resolution
# deduplicates /tmp and /private/tmp paths. $TMUX alone misses other servers.
socket_globs = [
  "/private/tmp/tmux-{uid}/*",
  "/tmp/tmux-{uid}/*",
  "/tmp/z4h-tmux-{uid}-*",
]

# How long a teammate's inbox must sit drained before its pane is reapable.
# Drained-but-recent means the agent may still be finishing up.
teammate_idle_minutes = 30

# Allow follow-up messages for 90 seconds after a SubagentStop completion event.
completion_grace_seconds = 90

# Report interactive sessions after this idle period; reap never kills them.
interactive_idle_minutes = 240

# The team lead holds the team's context. Reaping it needs --include-lead.
include_lead = false

# Gate for targeted unattended cleanup. The SessionEnd hook still has to pass
# both `--team <ended-session>` and `--kill`; malformed config fails closed,
# candidates are revalidated immediately before destruction, and ordinary
# report/manual dry-run commands ignore this gate.
kill_enabled = true

# Never reap these teammate names.
deny_agent_names = []

# If non-empty, only these teammate names are reapable.
allow_agent_names = []

# Limit disowned-process candidates to user-owned executable paths.
# An allowlist avoids classifying system services and login shells as strays.
stray_command_prefixes = ["~/", "/nix/store/"]
