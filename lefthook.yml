# uvx runs pinned pre-commit-hooks checks without a global install.
# `just sync` installs Git hooks; `just lefthook` checks every file as CI does.
min_version: 2.0.0

# Show failures and the result summary.
output:
  - failure
  - summary

pre-commit:
  parallel: true
  jobs:
    - name: check-yaml
      glob: "*.{yaml,yml}"
      run: uvx --from pre-commit-hooks==6.0.0 check-yaml {staged_files}

    - name: check-toml
      glob: "*.toml"
      run: uvx --from pre-commit-hooks==6.0.0 check-toml {staged_files}

    - name: check-json
      glob: "*.json"
      exclude:
        - "mcp_sync/tests/test_data/malformed_json.json"
      run: uvx --from pre-commit-hooks==6.0.0 check-json {staged_files}

    - name: check-added-large-files
      run: uvx --from pre-commit-hooks==6.0.0 check-added-large-files {staged_files}

    - name: check-case-conflict
      run: uvx --from pre-commit-hooks==6.0.0 check-case-conflict {staged_files}

    - name: check-ast
      glob: "*.py"
      run: uvx --from pre-commit-hooks==6.0.0 check-ast {staged_files}

    - name: check-symlinks
      run: uvx --from pre-commit-hooks==6.0.0 check-symlinks {staged_files}

    - name: detect-private-key
      run: uvx --from pre-commit-hooks==6.0.0 detect-private-key {staged_files}

    - name: forbid-new-submodules
      run: uvx --from pre-commit-hooks==6.0.0 forbid-new-submodules {staged_files}

    - name: name-tests-test
      glob: "{**/,}tests/**/*.py"
      run: uvx --from pre-commit-hooks==6.0.0 name-tests-test --pytest-test-first {staged_files}

    - name: trailing-whitespace
      # Re-stage fixes. Filter out binary files to prevent corruption.
      stage_fixed: true
      # `set -o pipefail` is required: lefthook runs `run:` through `sh -c`
      # without it, so a crashed filter would hand xargs empty input and the
      # job would report success having checked nothing.
      run: set -o pipefail; scripts/hook-text-files.py {staged_files} | xargs -0 uvx --from pre-commit-hooks==6.0.0 trailing-whitespace-fixer

    - name: detect-aws-credentials
      run: uvx --from pre-commit-hooks==6.0.0 detect-aws-credentials --allow-missing-credentials {staged_files}

    - name: gitleaks
      # CI runs the whole-tree scan; commits scan staged changes only.
      run: gitleaks git --staged --redact --no-banner

    - name: op-secret-policy
      # Require exact approved 1Password references and forbid tracked rendered
      # secret files. Whole-repo policy, not a per-file check.
      run: home/.local/bin/op-adopt --check-policy --policy home/.config/op/adopt-policy.json --repo-root .

commit-msg:
  jobs:
    - name: strip-claude-trailer
      # Enforce the no-Claude-attribution rule from home/.claude/CLAUDE.md.
      run: scripts/strip-claude-trailer.sh {1}
