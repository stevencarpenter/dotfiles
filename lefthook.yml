# Git hooks for this repo. Replaced pre-commit on 2026-08-29; the hook set is a
# one-for-one port of the old .pre-commit-config.yaml.
#
# WHY THE CHECKS SHELL OUT TO uvx
# lefthook has no hook registry of its own: a job is just a command. The
# language-agnostic file checks (yaml/toml/json/ast/symlink/private-key/...)
# are the same `pre-commit-hooks` package pre-commit used, pinned to the same
# 6.0.0 that the old `rev: v6.0.0` resolved to, and run through uvx so no
# global install is required. gitleaks and op-adopt are already on PATH
# (modules/home/packages.nix, home/.local/bin).
#
# INSTALLATION
# `lefthook install` writes .git/hooks/*. It runs from scripts/sync-side-channels.sh
# on every `just sync`, so a machine that syncs has the hooks wired. `just lefthook`
# runs the whole pre-commit group against every file, as CI does.
min_version: 2.0.0

# Fail the commit rather than printing a wall of green on success.
output:
  - failure
  - summary

pre-commit:
  parallel: true
  jobs:
    - name: check-yaml
      # Vim-golf fixtures are deliberately malformed mid-edit states
      # (wrapped strings, duplicate keys); format validity is not their contract.
      glob: "*.{yaml,yml}"
      exclude:
        - "exercises/vimgolf-august-2026/**"
      run: uvx --from pre-commit-hooks==6.0.0 check-yaml {staged_files}

    - name: check-toml
      glob: "*.toml"
      exclude:
        - "exercises/vimgolf-august-2026/**"
      run: uvx --from pre-commit-hooks==6.0.0 check-toml {staged_files}

    - name: check-json
      glob: "*.json"
      exclude:
        - "mcp_sync/tests/test_data/malformed_json.json"
      run: uvx --from pre-commit-hooks==6.0.0 check-json {staged_files}

    - name: check-added-large-files
      run: uvx --from pre-commit-hooks==6.0.0 check-added-large-files {staged_files}

    - name: check-case-conflict
      run: uvx --from pre-commit-hooks==6.0.0 check-case-conflict {staged_files}

    - name: check-ast
      # No glob: pre-commit's `types: [python]` matched on content too, so a
      # `*.py` glob silently dropped extensionless Python (op-adopt,
      # worktrunk-commit-generator). scripts/hook-python-files.py restores the
      # shebang match. `set -o pipefail` is required for the same reason as in
      # trailing-whitespace: a crashed filter would otherwise report success.
      run: set -o pipefail; scripts/hook-python-files.py {staged_files} | xargs -0 uvx --from pre-commit-hooks==6.0.0 check-ast

    - name: check-symlinks
      run: uvx --from pre-commit-hooks==6.0.0 check-symlinks {staged_files}

    - name: detect-private-key
      run: uvx --from pre-commit-hooks==6.0.0 detect-private-key {staged_files}

    - name: forbid-new-submodules
      run: uvx --from pre-commit-hooks==6.0.0 forbid-new-submodules {staged_files}

    - name: name-tests-test
      glob: "**/tests/*.py"
      run: uvx --from pre-commit-hooks==6.0.0 name-tests-test --pytest-test-first {staged_files}

    - name: trailing-whitespace
      # Rewrites files in place, so the fix has to be re-staged or the commit
      # would record the unfixed copy. scripts/hook-text-files.py replaces
      # pre-commit's `types: [text]` filter, which lefthook has no equivalent
      # of: handing a PNG to the fixer corrupts it.
      stage_fixed: true
      # `set -o pipefail` is required: lefthook runs `run:` through `sh -c`
      # without it, so a crashed filter would hand xargs empty input and the
      # job would report success having checked nothing.
      run: set -o pipefail; scripts/hook-text-files.py {staged_files} | xargs -0 uvx --from pre-commit-hooks==6.0.0 trailing-whitespace-fixer

    - name: detect-aws-credentials
      run: uvx --from pre-commit-hooks==6.0.0 detect-aws-credentials --allow-missing-credentials {staged_files}

    - name: gitleaks
      # Staged-only: a full `gitleaks dir .` takes ~3s on this tree, which is a
      # tax on every commit. dotfiles-hygiene-ci.yml runs the whole-tree scan.
      run: gitleaks git --staged --redact --no-banner

    - name: op-secret-policy
      # Require exact approved 1Password references and forbid tracked rendered
      # secret files. Whole-repo policy, not a per-file check.
      run: home/.local/bin/op-adopt --check-policy --policy home/.config/op/adopt-policy.json --repo-root .

# The chezmoi-native `machine-capability-audit` hook was dropped in the nix
# port: its source of truth (.chezmoidata/machines.toml) and its
# `.tmpl`/`.chezmoiignore` grep targets no longer exist. Capability gating now
# lives in lib/machines.nix and is enforced structurally by `nix flake check`
# (a gate referencing an undefined cap fails evaluation). A nix-flavored audit
# successor remains deferred.
commit-msg:
  jobs:
    - name: strip-claude-trailer
      # Enforce the no-Claude-attribution rule from home/.claude/CLAUDE.md.
      run: scripts/strip-claude-trailer.sh {1}

    - name: validate-commit-subject
      # Structural gate on the message git is about to record: Conventional
      # subject, no trailing period, blank line before a body, and balanced
      # delimiters. That last one is the one that kept escaping: five commits
      # on refactor/uv-scripts ended in a stray `)` left behind when the
      # `(#NN)` placeholder in the branch-first-pr skill was filled in without
      # an issue number. The rules already existed in the worktrunk generator's
      # --validate; they only ran for worktrunk-generated commits, so a plain
      # `git commit` from a skill or slash command never saw them.
      #
      # --validate-commit-file, not --validate: it skips the AI-attribution
      # rule (`fix: tune Claude hook timeout` is a legitimate subject here, and
      # strip-claude-trailer.sh above already covers the trailer), honors git's
      # comment and scissors lines, and exempts the subjects git generates
      # (Revert/Merge/fixup!) so revert, merge, and --fixup still work.
      run: home/.local/bin/worktrunk-commit-generator --validate-commit-file {1}
