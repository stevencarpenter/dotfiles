# dotfiles-manager bundle for ~/.dotfiles. The bundle and module manifests sit at the
# checkout root because the resolver confines each module's sources to the directory
# of its manifest, and the sources live in home/ and skills/. The profile is in dfm/.
schema = 1
id = "dotfiles"
core = "dfm-module-core.toml"

# DFM-55 (not merged): fs-link/v1 will require `directory = true` in the value of a directory
# source. The binary at cf9a5f4 rejects the key (E_FIELD_UNKNOWN), so it is not set yet.
# Add it to these 47 resources when the DFM-55 manager commit is installed:
#   core.config-zsh-lib
#   core.config-nvim
#   core.config-yazi
#   core.config-tmux
#   core.config-ghostty
#   core.config-git
