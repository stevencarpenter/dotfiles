# ---- assemblies (Codex and Pi AGENTS.md) ----
# Body, then "\n" before each fragment, fragments in byte order. Fragments: the 20-output-policy.md links
# above, plus 10-pi-runtime.md from the mcp module for pi.
[[resources]]
id = "codex-agents"
kind = "assemble"
adapter = "text-fragments/v1"
target = ".codex/AGENTS.md"
[resources.value]
body = "home/.codex/AGENTS.md"
fragments_dir = ".codex/AGENTS.d"
pattern = "*.md"
separator = "\n"

[[resources]]
id = "pi-agents"
kind = "assemble"
adapter = "text-fragments/v1"
target = ".pi/agent/AGENTS.md"
[resources.value]
body = "home/.codex/AGENTS.md"
fragments_dir = ".pi/agent/AGENTS.d"
pattern = "*.md"
separator = "\n"

# ---- Claude settings ----
# This table is the source: the adapter reads no file. home/.claude/settings-base.json is
# the pre-cutover copy (scripts/test-tmux-lifecycle-contract.sh reads its reap timeouts).
# Values were taken from it plus the personal-mac variant:
# dev = true (six plugins true), work = false (atlassian false).
# sandbox.filesystem.allowWrite is empty here (append needs the array under managed). Each
# identity module links a .claude/settings.d fragment that appends its own absolute paths.
# Hooks are handlers. The two SessionStart handlers are contributed by the personal
# (hippo) and agents (routing) modules. Edit-in-tool values stay: tables merge, plugins
# the application enables survive, and model and effortLevel are seeds.
[[resources]]
id = "claude-settings"
kind = "merge"
adapter = "claude-settings/v1"
target = ".claude/settings.json"
[resources.value]
append = ["/sandbox/filesystem/allowWrite"]
fragments_dir = ".claude/settings.d"
pattern = "*.json"
[resources.value.managed]
"$schema" = "https://json.schemastore.org/claude-code-settings.json"
outputStyle = "STE"
verbose = false
autoDreamEnabled = true
skipDangerousModePermissionPrompt = true
skipAutoPermissionPrompt = true
voiceEnabled = true
teammateMode = "tmux"
cleanupPeriodDays = 14
[resources.value.managed.env]
CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS = "1"
CLAUDE_CODE_NO_FLICKER = "1"
ENABLE_LSP_TOOL = "1"
CLAUDE_CODE_FORK_SUBAGENTS = "1"
CLAUDE_CODE_WORKFLOWS = "1"
CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS = "64"
[resources.value.managed.permissions]
defaultMode = "auto"
[resources.value.managed.statusLine]
type = "command"
command = "bash ~/.claude/statusline-command.sh"
[resources.value.managed.skillOverrides]
building-browser-extensions = "off"
claude-cost = "off"
record-todo = "off"
[resources.value.managed.extraKnownMarketplaces.claude-plugins-official.source]
source = "github"
repo = "anthropics/claude-plugins-official"
[resources.value.managed.extraKnownMarketplaces.ponytail.source]
source = "github"
repo = "DietrichGebert/ponytail"
[resources.value.managed.enabledPlugins]
"atlassian@claude-plugins-official" = false
"claude-code-setup@claude-plugins-official" = false
"claude-md-management@claude-plugins-official" = true
"code-review@claude-plugins-official" = true
"code-simplifier@claude-plugins-official" = false
"commit-commands@claude-plugins-official" = true
"context7@claude-plugins-official" = true
"explanatory-output-style@claude-plugins-official" = false
"feature-dev@claude-plugins-official" = false
"frontend-design@claude-plugins-official" = true
"github@claude-plugins-official" = false
"gopls-lsp@claude-plugins-official" = true
"hookify@claude-plugins-official" = true
"jdtls-lsp@claude-plugins-official" = false
"learning-output-style@claude-plugins-official" = false
"lua-lsp@claude-plugins-official" = true
"playwright@claude-plugins-official" = true
"ponytail@ponytail" = true
"pyright-lsp@claude-plugins-official" = true
"railway@claude-plugins-official" = true
"ralph-loop@claude-plugins-official" = true
"rust-analyzer-lsp@claude-plugins-official" = true
"security-guidance@claude-plugins-official" = true
"semgrep@claude-plugins-official" = false
"skill-creator@claude-plugins-official" = true
"superpowers@claude-plugins-official" = true
"swift-lsp@claude-plugins-official" = true
"typescript-lsp@claude-plugins-official" = true
[resources.value.managed.sandbox.filesystem]
allowWrite = []

[resources.value.seed]
model = "opusplan"
effortLevel = "xhigh"

[resources.value.handlers.em-dash-check]
event = "PreToolUse"
matcher = "Bash"
type = "command"
argv = ["${HOME}/.claude/hooks/no-em-dash-commit.sh"]
[resources.value.handlers.worktree-create]
event = "WorktreeCreate"
type = "command"
argv = ["${HOME}/.claude/hooks/wt-create.sh"]
[resources.value.handlers.worktree-remove]
event = "WorktreeRemove"
type = "command"
argv = ["${HOME}/.claude/hooks/wt-remove.sh"]
[resources.value.handlers.journal-stop]
event = "Stop"
type = "command"
argv = ["${HOME}/.claude/hooks/agent-journal-stop.sh"]
[resources.value.handlers.journal-subagent-stop]
event = "SubagentStop"
type = "command"
argv = ["${HOME}/.claude/hooks/agent-journal-stop.sh"]
[resources.value.handlers.reap-stop]
event = "Stop"
type = "command"
argv = ["${HOME}/.claude/hooks/agent-reap-stop.sh"]
timeout = 20
[resources.value.handlers.reap-session-end]
event = "SessionEnd"
type = "command"
argv = ["${HOME}/.claude/hooks/agent-reap-session-end.sh"]
timeout = 20

[resources.policy]
defaults = []
extensions = ["/handlers"]
