# ---- assemblies (nix codexAgentsAssemble and piAgentsAssemble) ----
# Same body and separator as the nix activation: body, then "\n" before each
# fragment, fragments in byte order. Fragments: the 20-output-policy.md links
# above, plus 10-pi-runtime.md from the mcp module for pi.
[[resources]]
id = "codex-agents"
kind = "assemble"
adapter = "text-fragments/v1"
target = ".codex/AGENTS.md"
[resources.value]
body = "home/.codex/AGENTS.md"
fragments_dir = ".codex/AGENTS.d"
pattern = "*.md"
separator = "\n"

[[resources]]
id = "pi-agents"
kind = "assemble"
adapter = "text-fragments/v1"
target = ".pi/agent/AGENTS.md"
[resources.value]
body = "home/.codex/AGENTS.md"
fragments_dir = ".pi/agent/AGENTS.d"
pattern = "*.md"
separator = "\n"

# ---- Claude settings (nix claudeSettingsMerge) ----
# Managed: scalar and small-object top-level keys that the application does not
# rewrite in place. Waiting for DFM-48 (object merge, append, settings.d):
#   permissions.defaultMode, enabledPlugins (base + dev/work variant),
#   skillOverrides, extraKnownMarketplaces, sandbox.filesystem.allowWrite append,
#   hooks with a matcher or timeout (PreToolUse Bash no-em-dash-commit,
#   SubagentStop agent-reap-subagent-stop, SessionEnd agent-reap-session-end),
#   settings.d fragments.
# Hooks are NOT declared here. The rehearsal showed that every handler is added
# as a second entry next to the hook entries the nix merge wrote into the live
# file ("~/..." or absolute command text differs from the adapter's quoted
# "${HOME}/..." text), so each hook would run twice. WorktreeCreate and
# WorktreeRemove must not run twice. Until DFM-48 can match or replace the
# existing entries, the hook entries already in settings.json stay as foreign
# content. The declarations to add then are: WorktreeCreate wt-create.sh,
# WorktreeRemove wt-remove.sh, Stop agent-journal-stop.sh, SubagentStop
# agent-journal-stop.sh (agents.session-routing and personal.session-hippo
# contribute the two SessionStart hooks). Use argv ["${HOME}/.claude/hooks/<file>"],
# because the adapter single-quotes a leading "~".
[[resources]]
id = "claude-settings"
kind = "merge"
adapter = "claude-settings/v1"
target = ".claude/settings.json"
[resources.value.managed]
"$schema" = "https://json.schemastore.org/claude-code-settings.json"
outputStyle = "STE"
verbose = false
autoDreamEnabled = true
skipDangerousModePermissionPrompt = true
skipAutoPermissionPrompt = true
voiceEnabled = true
teammateMode = "tmux"
cleanupPeriodDays = 14
[resources.value.managed.env]
CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS = "1"
CLAUDE_CODE_NO_FLICKER = "1"
ENABLE_LSP_TOOL = "1"
CLAUDE_CODE_FORK_SUBAGENTS = "1"
CLAUDE_CODE_WORKFLOWS = "1"
CLAUDE_CODE_MAX_CONCURRENT_SUBAGENTS = "64"
[resources.value.managed.statusLine]
type = "command"
command = "bash ~/.claude/statusline-command.sh"
[resources.value.handlers]
[resources.value.seed]
model = "opusplan"
effortLevel = "xhigh"
[resources.policy]
defaults = []
extensions = ["/handlers"]
