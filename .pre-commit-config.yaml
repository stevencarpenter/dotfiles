repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
        exclude: ^mcp_sync/tests/test_data/malformed_json\.json$
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-ast
      - id: check-symlinks
      - id: detect-private-key
      - id: forbid-new-submodules
      - id: name-tests-test
        args:
          - --pytest-test-first
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: detect-aws-credentials
        args:
          - "--allow-missing-credentials"

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # The chezmoi-native `machine-capability-audit` hook was dropped in the
      # nix port: its source of truth (.chezmoidata/machines.toml) and its
      # `.tmpl`/`.chezmoiignore` grep targets no longer exist. Capability gating
      # now lives in lib/machines.nix and is enforced structurally by
      # `nix flake check` (a gate referencing an undefined cap fails evaluation).
      # See docs/nix-migration.md for the deferred nix-flavored audit successor.
      - id: strip-claude-trailer
        name: Strip Co-Authored-By Claude trailer
        description: Enforce the no-Claude-attribution rule from home/.claude/CLAUDE.md
        language: script
        entry: scripts/strip-claude-trailer.sh
        stages: [commit-msg]

default_install_hook_types: [pre-commit, commit-msg]
default_language_version:
  python: python3.14
