# tiling capability: the shared sketchybar and borders files. aerospace.toml, machine.env
# and layouts differ per identity, so the identity module links them.

schema = 1
id = "tiling"
platforms = ["macos"]
requires = []

[[resources]]
id = "config-sketchybar-sketchybarrc"
kind = "link"
adapter = "fs-link/v1"
target = ".config/sketchybar/sketchybarrc"
[resources.value]
source = "home/.config/sketchybar/sketchybarrc"

[[resources]]
id = "config-sketchybar-items"
kind = "link"
adapter = "fs-link/v1"
target = ".config/sketchybar/items"
[resources.value]
source = "home/.config/sketchybar/items"
directory = true

[[resources]]
id = "config-sketchybar-plugins"
kind = "link"
adapter = "fs-link/v1"
target = ".config/sketchybar/plugins"
[resources.value]
source = "home/.config/sketchybar/plugins"
directory = true

[[resources]]
id = "config-borders"
kind = "link"
adapter = "fs-link/v1"
target = ".config/borders"
[resources.value]
source = "home/.config/borders"
directory = true
